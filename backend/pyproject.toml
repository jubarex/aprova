[project]
name = "aprova-command"
version = "0.1.0"
description = "Aprova Command - coordenação assíncrona de validação de formulários municipais (demo)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13,<2",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]
